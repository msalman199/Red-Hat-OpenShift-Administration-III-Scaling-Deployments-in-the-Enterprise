apiVersion: v1
kind: Pod
metadata:
  name: privileged-test-pod
  labels:
    app: privileged-test
spec:
  serviceAccountName: privileged-sa
  containers:
  - name: privileged-container
    image: registry.access.redhat.com/ubi8/ubi:latest
    command: ["/bin/bash"]
    args: ["-c", "while true; do echo 'Privileged pod running...'; sleep 30; done"]
    securityContext:
      privileged: true
      capabilities:
        add:
        - SYS_ADMIN
        - NET_ADMIN
    volumeMounts:
    - name: host-root
      mountPath: /host
      readOnly: true
  volumes:
  - name: host-root
    hostPath:
      path: /
      type: Directory
  restartPolicy: Never

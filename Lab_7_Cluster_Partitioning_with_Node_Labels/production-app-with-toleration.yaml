apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-app-toleration
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-app-toleration
  template:
    metadata:
      labels:
        app: production-app-toleration
    spec:
      nodeSelector:
        environment: production
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "production"
        effect: "NoSchedule"
      containers:
      - name: prod-app
        image: registry.redhat.io/ubi8/httpd-24:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        ports:
        - containerPort: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-app-toleration
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testing-app-toleration
  template:
    metadata:
      labels:
        app: testing-app-toleration
    spec:
      nodeSelector:
        environment: testing
      tolerations:
      - key: "testing-only"
        operator: "Equal"
        value: "true"
        effect: "NoExecute"
      containers:
      - name: test-app
        image: registry.redhat.io/ubi8/ubi:latest
        command: ["/bin/bash"]
        args: ["-c", "while true; do echo 'Testing application running...'; sleep 30; done"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

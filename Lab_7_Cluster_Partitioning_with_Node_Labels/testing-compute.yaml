apiVersion: apps/v1
kind: Deployment
metadata:
  name: testing-compute
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testing-compute
  template:
    metadata:
      labels:
        app: testing-compute
    spec:
      nodeSelector:
        environment: testing
        workload: compute-intensive
        disk-type: ssd
      containers:
      - name: compute-app
        image: registry.redhat.io/ubi8/ubi:latest
        command: ["/bin/bash"]
        args: ["-c", "while true; do echo 'Computing...'; sleep 30; done"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"

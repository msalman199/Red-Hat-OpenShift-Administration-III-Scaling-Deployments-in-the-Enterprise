apiVersion: apps/v1
kind: Deployment
metadata:
  name: development-webapp
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: development-webapp
  template:
    metadata:
      labels:
        app: development-webapp
    spec:
      nodeSelector:
        environment: development
        workload: web-frontend
      containers:
      - name: webapp
        image: registry.redhat.io/ubi8/httpd-24:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        ports:
        - containerPort: 8080

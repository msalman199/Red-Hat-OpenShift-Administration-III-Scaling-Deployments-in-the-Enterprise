apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: prometheus-lab
  annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port:   '9090'
spec:
  selector: 
    app: prometheus
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 9090 
    protocol: TCP
